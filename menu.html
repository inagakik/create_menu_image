<meta name="theme-color" content="#1d5679">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="つむぎごはん">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  :root{
    --ink:#315b78;
    --blue:#5f86a1;
    --pale:#e9f0f3;
    --paper:#f8f3e8;
    --line:#9bb2c0;
    --red:#bd6b62;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:#dce5e8;
    color:#294b62;
    font-family:"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  }
  .app{
    max-width:1100px;
    margin:auto;
    padding:18px;
    display:grid;
    grid-template-columns:minmax(300px,1fr) 360px;
    gap:18px;
  }
  h1{font-size:20px;margin:0 0 4px;letter-spacing:.08em}
  .sub{font-size:12px;color:#688396;margin-bottom:14px}
  .panel{
    background:rgba(255,255,255,.78);
    border:1px solid rgba(49,91,120,.12);
    border-radius:18px;
    padding:16px;
    box-shadow:0 8px 30px rgba(40,70,85,.08);
  }
  .preview-wrap{
    display:flex;justify-content:center;align-items:flex-start;
  }
  canvas{
    width:min(100%,720px);
    height:auto;
    display:block;
    border-radius:8px;
    box-shadow:0 10px 30px rgba(35,58,70,.18);
    touch-action:none;
    background:var(--paper);
  }
  .controls{display:flex;flex-direction:column;gap:12px}
  .group{
    border-top:1px solid #d5e0e5;
    padding-top:12px;
  }
  .group:first-child{border-top:0;padding-top:0}
  label.title{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
  .row{display:flex;gap:8px}
  .row+.row{margin-top:7px}
  input.narrow{flex:0 0 108px;max-width:108px}
  input[type=date]{flex:0 0 152px;max-width:152px;color:#294b62}
  .row.check{flex-wrap:wrap;align-items:center}
  .row.item{align-items:center}
  button.mini{

<body>
<div class="app">
  <div class="panel preview-wrap">
    <canvas id="canvas" width="1181" height="1713"></canvas>
  </div>
  <div class="panel">
    <div class="sub">縦14.5cm × 横10cm（300dpi / 1181 × 1713 px）のメニュー表をつくります。</div>

      <div class="group">

        <label class="title">メニュー一覧</label>

        <button class="link" id="clearSaved" type="button" style="width:100%">保存されている入力内容を消す</button>

      <div class="adj-actions">
        <button class="secondary" id="adjReset" type="button">この画像を初期位置に戻す</button>
        <button id="adjDone" type="button">これでOK</button>

<script src="common.js"></script>
<script>
const STORE_KEY="menu";
const W=1181,H=1713;
const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");
const IMG={};
const dc=(o)=>Object.assign({size:40,font:"gothic",color:"#315b78",strokeOn:false,strokeColor:"#ffffff",weight:700},o);
let titleConf=dc({size:96,font:"mincho",color:"#315b78"});
let subConf=dc({size:34,font:"gothic",color:"#7b909a",weight:600});
let nameConf=dc({size:52,font:"mincho",color:"#294b62"});
let priceConf=dc({size:46,font:"gothic",color:"#4f7897"});
let descConf=dc({size:32,font:"gothic",color:"#6d8b9b",weight:600});
let shopConf=dc({size:24,font:"mincho",color:"#4f7897",weight:600});
const MAX_ITEMS=8,MAX_LI=5;
let items=[
  {name:"日替わりランチ",price:"1000",mode:"list",list:["主菜・小鉢二品","ごはん・お味噌汁つき"],dir:"v",text:""},
  {name:"つむぎ定食",price:"1200",mode:"text",list:[""],dir:"v",text:"その日のおすすめを一枚のお皿に。\n食後のお飲み物つき。"}
];

/* ---- 入力欄の組み立て ---- */
function renderItems(){
  const box=document.getElementById("items");
  box.innerHTML=items.map((it,i)=>{
    const li=(it.list.length?it.list:[""]).map((v,j)=>`
      <div class="li-row">
        <button class="mini round" type="button" data-act="delLi" data-i="${i}" data-j="${j}" ${it.list.length<=1?"disabled":""} aria-label="項目を削除">－</button>
        <input type="text" data-fld="li" data-i="${i}" data-j="${j}" value="${esc(v)}" placeholder="説明の項目">
      </div>`).join("");
    const addLi=it.list.length<MAX_LI?`
      <div class="li-row"><button class="mini round" type="button" data-act="addLi" data-i="${i}" aria-label="項目を追加">＋</button><span class="photo-note">項目を追加</span></div>`:"";
    const listPart=`
      <div class="mode-row">
        <div class="seg small" data-seg="dir" data-i="${i}">
          <button type="button" data-val="v" class="${it.dir==="v"?"on":""}">縦並び</button>
          <button type="button" data-val="h" class="${it.dir==="h"?"on":""}">横並び</button>
        </div>
      </div>${li}${addLi}`;
    const textPart=`<div class="item-body"><textarea data-fld="text" data-i="${i}" rows="3" placeholder="説明（改行できます）">${esc(it.text)}</textarea></div>`;
    return `
    <div class="item-card">
      <div class="top">
        <button class="mini round" type="button" data-act="delItem" data-i="${i}" ${items.length<=1?"disabled":""} aria-label="このメニューを削除">－</button>
        <input type="text" data-fld="name" data-i="${i}" value="${esc(it.name)}" placeholder="料理名">
        <input class="price-in" type="text" data-fld="price" data-i="${i}" value="${esc(it.price)}" placeholder="1000">
      </div>
      <div class="sub-label">説明の入れ方</div>
      <div class="mode-row">
        <div class="seg small" data-seg="mode" data-i="${i}">
          <button type="button" data-val="none" class="${it.mode==="none"?"on":""}">なし</button>
          <button type="button" data-val="list" class="${it.mode==="list"?"on":""}">リスト</button>
          <button type="button" data-val="text" class="${it.mode==="text"?"on":""}">文章</button>
        </div>
      </div>
      ${it.mode==="list"?listPart:(it.mode==="text"?textPart:"")}
    </div>`;
  }).join("");
  document.getElementById("addRow").style.display=items.length<MAX_ITEMS?"":"none";
}
function blank(){return {name:"",price:"",mode:"list",list:[""],dir:"v",text:""}}
document.getElementById("items").addEventListener("input",e=>{
  const el=e.target,i=Number(el.dataset.i);
  if(el.dataset.fld==="name")items[i].name=el.value;
  else if(el.dataset.fld==="price")items[i].price=el.value;
  else if(el.dataset.fld==="text")items[i].text=el.value;
  else if(el.dataset.fld==="li")items[i].list[Number(el.dataset.j)]=el.value;
  else return;
  draw();scheduleSave();
});
document.getElementById("items").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const i=Number(b.dataset.i);
  const seg=b.parentElement&&b.parentElement.dataset?b.parentElement.dataset.seg:null;
  if(seg==="mode"){items[i].mode=b.dataset.val}
  else if(seg==="dir"){items[i].dir=b.dataset.val}
  else if(b.dataset.act==="delItem"){if(items.length>1)items.splice(i,1)}
  else if(b.dataset.act==="addLi"){if(items[i].list.length<MAX_LI)items[i].list.push("")}
  else if(b.dataset.act==="delLi"){if(items[i].list.length>1)items[i].list.splice(Number(b.dataset.j),1)}
  else return;
  renderItems();draw();scheduleSave();
});
document.getElementById("addItem").addEventListener("click",()=>{
  if(items.length>=MAX_ITEMS)return;
  items.push(blank());renderItems();draw();scheduleSave();
});

/* ---- 描画 ---- */
function yen(v){
  const t=String(v||"").trim();
  if(!t)return "";
  if(/^[0-9]+$/.test(t))return "￥"+Number(t).toLocaleString("ja-JP");
  if(/^[0-9,]+$/.test(t))return "￥"+t;
  return t;
}
function descLines(it,maxW){
  if(it.mode==="none")return [];
  if(it.mode==="text")return wrapByWidth(ctx,it.text,descConf,maxW).filter(s=>s!==""||false);
  const arr=it.list.map(s=>String(s).trim()).filter(Boolean);
  if(!arr.length)return [];
  if(it.dir==="v")return arr.map(s=>"・"+s);
  return wrapByWidth(ctx,arr.map(s=>"・"+s).join("　"),descConf,maxW);
}
function layout(scale){
  const M=96,IND=Math.round(44*scale);
  const L=M,R=W-M,maxW=R-L-IND;
  const blocks=[];
  let h=0;
  items.forEach(it=>{
    const name=String(it.name||"").trim(),price=yen(it.price);
    const lines=descLines(it,maxW/scale);
    if(!name&&!price&&!lines.length)return;
    const nh=(name||price)?Math.round(nameConf.size*scale*1.25):0;
    const dh=lines.length?Math.round(lines.length*descConf.size*scale*1.5)+10:0;
    blocks.push({name:name,price:price,lines:lines,nh:nh,dh:dh});
    h+=nh+dh+Math.round(42*scale);
  });
  return {L:L,R:R,IND:IND,maxW:maxW,blocks:blocks,h:h};
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const clear=chk("bgClear");
  canvas.style.background=clear?"repeating-conic-gradient(#e7eef1 0% 25%, #ffffff 0% 50%) 50% / 28px 28px":"transparent";
  if(!clear){ctx.fillStyle=val("pageBg")||"#fbf6ec";ctx.fillRect(0,0,W,H)}
  const line=val("lineColor")||"#9bb2c0";
  if(chk("frameOn")){
    ctx.save();ctx.strokeStyle=line;
    ctx.lineWidth=3;ctx.strokeRect(46,46,W-92,H-92);
    ctx.lineWidth=1.4;ctx.strokeRect(60,60,W-120,H-120);
    ctx.restore();
  }
  // タイトル
  let y=150;
  const title=val("menuTitle").trim();
  if(title){
    y+=titleConf.size*0.9;
    drawLine(ctx,title,W/2,y,titleConf,"center");
    y+=titleConf.size*0.25;
  }
  const sub=val("subTitle").trim();
  if(sub){
    y+=subConf.size*1.35;
    drawLine(ctx,sub,W/2,y,subConf,"center");
  }
  y+=48;
  ctx.save();ctx.strokeStyle=line;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(120,y);ctx.lineTo(W-120,y);ctx.stroke();ctx.restore();
  const top=y+70;
  const bottom=(chk("shopOn")&&val("shopName").trim())?H-160:H-130;
  // 入りきらないときは縮める
  let sc=1,L=layout(1);
  if(L.h>bottom-top&&L.h>0){
    sc=Math.max(0.55,(bottom-top)/L.h);
    L=layout(sc);
  }
  // 55% まで縮めても入りきらない（下にはみ出す）か
  const overflow=L.h>bottom-top+1;
  const nc=Object.assign({},nameConf,{size:nameConf.size*sc});
  const pc=Object.assign({},priceConf,{size:priceConf.size*sc});
  const dcf=Object.assign({},descConf,{size:descConf.size*sc});
  let cy=top;
  L.blocks.forEach(b=>{
    if(b.nh){
      cy+=nc.size*0.92;
      // 料理名が長いときは、値段と重ならないよう料理名だけ小さくする
      const pw=b.price?measureW(ctx,b.price,pc)+Math.round(36*sc):0;
      if(b.name)drawLine(ctx,b.name,L.L,cy,fitConf(ctx,b.name,nc,L.R-L.L-pw,14),"left");
      if(b.price)drawLine(ctx,b.price,L.R,cy,pc,"right");
      cy+=nc.size*0.33;
    }
    if(b.lines.length){
      cy+=10;
      b.lines.forEach(t=>{
        cy+=dcf.size*1.2;
        drawLine(ctx,t,L.L+L.IND,cy,dcf,"left");
        cy+=dcf.size*0.3;
      });
    }
    cy+=42*sc;
  });
  const shop=val("shopName").trim();
  if(chk("shopOn")&&shop){
    drawLine(ctx,shop,W-96,H-110,shopConf,"right");
  }
  const n=document.getElementById("fitNote");
  if(n){
    n.textContent=overflow?"※ 文字を "+Math.round(sc*100)+"% まで縮めても用紙に入りきりません。メニューや説明を減らすか、文字を小さくしてください。"
      :sc<1?"※ 用紙に入れるため、文字を "+Math.round(sc*100)+"% に縮めて表示しています。":"※ 用紙に入りきらないときは自動で少し縮めて表示します。";
    n.style.color=overflow?"#bd6b62":"";
    n.style.fontWeight=overflow?"700":"";
  }
}
/* ---- 書式 ---- */
const FMT={title:()=>[titleConf,"タイトルの書式",30,160],
  sub:()=>[subConf,"小見出しの書式",16,90],
  name:()=>[nameConf,"料理名の書式",20,110],
  price:()=>[priceConf,"値段の書式",20,110],
  desc:()=>[descConf,"説明の書式",14,80],
  shop:()=>[shopConf,"店名（右下）の書式",12,60]};
document.querySelectorAll("button[data-fmt]").forEach(b=>{
  b.addEventListener("click",()=>{
    const g=FMT[b.dataset.fmt];if(!g)return;
    const a=g();openFmt(a[0],a[1],a[2],a[3]);
  });
});

/* ---- 保存・復元 ---- */
function pageSnapshot(){return {items:items,titleConf:titleConf,subConf:subConf,nameConf:nameConf,priceConf:priceConf,descConf:descConf,shopConf:shopConf}}
function pageRestore(x){
  if(Array.isArray(x.items)&&x.items.length)items=x.items.map(it=>Object.assign(blank(),it));
  if(x.titleConf)titleConf=dc(x.titleConf);
  if(x.subConf)subConf=dc(x.subConf);
  if(x.nameConf)nameConf=dc(x.nameConf);
  if(x.priceConf)priceConf=dc(x.priceConf);
  if(x.descConf)descConf=dc(x.descConf);
  if(x.shopConf)shopConf=dc(x.shopConf);
}
function pageRebuild(){renderItems()}
function pageAfterRestore(){}

document.getElementById("ctl").addEventListener("input",draw);
document.getElementById("ctl").addEventListener("change",draw);
document.getElementById("export").addEventListener("click",()=>{
  exportPng(canvas,`tsumugi_gohan_menu_${fileStamp()}.png`,{dpi:300});
});
renderItems();
bindAutoSave();
draw();
restoreAll();
</script>
