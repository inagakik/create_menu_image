<meta name="theme-color" content="#1d5679">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="つむぎごはん">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  :root{
    --ink:#315b78;
    --blue:#5f86a1;
    --pale:#e9f0f3;
    --paper:#f8f3e8;
    --line:#9bb2c0;
    --red:#bd6b62;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:#dce5e8;
    color:#294b62;
    font-family:"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  }
  .app{
    max-width:1100px;
    margin:auto;
    padding:18px;
    display:grid;
    grid-template-columns:minmax(300px,1fr) 360px;
    gap:18px;
  }
  h1{font-size:20px;margin:0 0 4px;letter-spacing:.08em}
  .sub{font-size:12px;color:#688396;margin-bottom:14px}
  .panel{
    background:rgba(255,255,255,.78);
    border:1px solid rgba(49,91,120,.12);
    border-radius:18px;
    padding:16px;
    box-shadow:0 8px 30px rgba(40,70,85,.08);
  }
  .preview-wrap{
    display:flex;justify-content:center;align-items:flex-start;
  }
  canvas{
    width:min(100%,720px);
    height:auto;
    display:block;
    border-radius:8px;
    box-shadow:0 10px 30px rgba(35,58,70,.18);
    touch-action:none;
    background:var(--paper);
  }
  .controls{display:flex;flex-direction:column;gap:12px}
  .group{
    border-top:1px solid #d5e0e5;
    padding-top:12px;
  }
  .group:first-child{border-top:0;padding-top:0}
  label.title{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
  .row{display:flex;gap:8px}
  .row+.row{margin-top:7px}
  input.narrow{flex:0 0 108px;max-width:108px}
  input[type=date]{flex:0 0 152px;max-width:152px;color:#294b62}
  .row.check{flex-wrap:wrap;align-items:center}
  .row.item{align-items:center}
  button.mini{
    flex:0 0 26px;width:26px;height:26px;padding:0;border-radius:50%;
    background:#e8eff2;color:#315b78;font-size:16px;font-weight:700;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  button.mini:disabled{opacity:.3;cursor:default}
  button.add{
    width:100%;margin-top:8px;background:#eef4f6;color:#315b78;
    font-size:12px;padding:9px;
  }
  button.add[hidden]{display:none}
  .chk{
    display:flex;align-items:center;gap:6px;font-size:12px;color:#4a6b80;
    white-space:nowrap;cursor:pointer;
  }
  .chk input[type=checkbox]{width:16px;height:16px;accent-color:#4f7897;cursor:pointer}
  input[type=color]{
    flex:0 0 46px;max-width:46px;height:40px;padding:3px;cursor:pointer;
    border:1px solid #c7d5dc;border-radius:10px;background:#fff;
  }
  input[type=text]{
    width:100%;padding:10px 11px;border:1px solid #c7d5dc;border-radius:10px;
    background:#fff;font:inherit;font-size:13px;
  }
  .photo-row{
    display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;
    margin:7px 0;
  }
  .thumb{
    width:64px;height:50px;object-fit:cover;border-radius:8px;background:#e7eef1;
    border:1px solid #c9d8df;
  }
  .photo-name{font-size:12px;font-weight:700}
  .photo-note{font-size:10px;color:#79909e;margin-top:2px}
  button{
    border:0;border-radius:10px;padding:10px 12px;background:#5f86a1;color:white;
    font:700 12px inherit;cursor:pointer;
  }
  button.secondary{background:#e8eff2;color:#315b78}
  button.export{background:#315b78;font-size:14px;padding:13px}
  button:active{transform:translateY(1px)}
  .hint{
    font-size:10px;color:#718995;line-height:1.6;background:#f0f5f6;border-radius:10px;padding:9px;
  }
  .footer{font-size:10px;color:#7b909a;text-align:center;padding:3px}
  .head{display:flex;align-items:center;gap:8px;justify-content:flex-end;min-height:22px}
  button.help{
    width:22px;height:22px;flex:0 0 22px;padding:0;border:0;border-radius:50%;
    background:#e3ecef;color:#41647c;font-size:12px;font-weight:700;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  button.help:hover{background:#cfdde3}
  .modal[hidden]{display:none}
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal-back{position:absolute;inset:0;background:rgba(29,86,121,.45)}
  .modal-card{
    font-family:"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
    position:relative;width:min(560px,100%);max-height:84vh;display:flex;flex-direction:column;
    background:#fff;border-radius:14px;box-shadow:0 18px 40px rgba(20,50,70,.25);overflow:hidden;
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:13px 16px;border-bottom:1px solid #e2eaee;font-size:14px;color:#294b62;
  }
  button.modal-close{
    background:none;border:0;color:#5f86a1;font-size:20px;line-height:1;
    padding:0 4px;cursor:pointer;width:auto;
  }
  .modal-body{padding:6px 16px 16px;overflow:auto}
  .modal-lead{font-size:11px;color:#7b909a;line-height:1.7;padding:8px 2px 4px}
  .qa{border-bottom:1px solid #eef3f5}
  .qa summary{
    cursor:pointer;padding:10px 2px;font-size:13px;font-weight:700;color:#315b78;list-style:none;
    display:flex;align-items:flex-start;gap:6px;
  }
  .qa summary::-webkit-details-marker{display:none}
  .qa summary::before{content:"Q";color:#8fb0c2;font-size:11px;padding-top:2px}
  .qa .a{font-size:12px;line-height:1.75;color:#5c7787;padding:0 2px 12px 18px}
  .qa[open] summary{color:#1d5679}
  @media(max-width:850px){
    .app{grid-template-columns:1fr;padding:10px}
    .panel{padding:10px}
    .controls{order:2}
  }
  button.mini.gear{
    flex:0 0 auto;width:auto;height:26px;border-radius:9px;padding:0 9px;
    font-size:11px;font-weight:700;
  }
  .set-row.note{border-bottom:none;padding-top:2px}
  .set-row.note .msg{flex:1;font-size:11px;line-height:1.5;color:#7b909a}
  .set-row{
    display:flex;align-items:center;gap:10px;padding:10px 2px;
    border-bottom:1px solid #eef3f5;font-size:12px;color:#4a6b80;
  }
  .set-row>.key{flex:0 0 74px;font-weight:700;color:#315b78}
  .set-row .val{flex:0 0 34px;font-size:11px;color:#7b909a;text-align:right}
  .set-row input[type=range]{flex:1;accent-color:#4f7897}
  .set-row select{
    flex:1;padding:8px 9px;border:1px solid #c7d5dc;border-radius:10px;
    background:#fff;font:inherit;font-size:12px;color:#294b62;
  }
  .seg{display:flex;gap:6px;flex:1}
  .seg button{background:#eef4f6;color:#5f86a1;font-size:12px;padding:8px 0;flex:1;width:auto}
  .seg button.on{background:#4f7897;color:#fff}
  .set-note{font-size:10px;color:#8aa0ac;line-height:1.7;padding:10px 2px 2px}
  .adj-cv{width:100%;max-width:430px;display:block;margin:0 auto;touch-action:none;border-radius:14px;background:#dce8ed;cursor:grab}
  .adj-hint{font-size:11px;color:#7b909a;line-height:1.8;margin:10px 0 2px}
  .adj-actions{display:flex;gap:8px;margin-top:10px}
  .adj-actions button{flex:1}
  button.link{background:none;color:#7b909a;font-size:11px;padding:4px;box-shadow:none}
</style>
</head>
<body>
<div class="app">
  <section class="panel">
    <div class="sub">写真と料理名を入れ替えるだけ。Instagram用 1080 × 1080 px。</div>
    <div class="preview-wrap"><canvas id="canvas" width="1080" height="1080"></canvas></div>
  </section>

  <section class="panel controls">
    <div class="group">
      <label class="title">タイトル</label>
      <div class="row">
        <input id="headline" type="text" value="本日のランチ">
        <input id="dateText" type="date" aria-label="日付">
      </div>
      <div id="tgRows">
      <div class="row item" id="tgrow-0"><button class="mini" type="button" data-tgdel="0" title="この行を削除" aria-label="この行を削除">&minus;</button><input id="tg-0" type="text" value="" placeholder="写真に重なる一言（1行目）"><button class="mini gear" type="button" data-tgset="0" title="この行の書式" aria-label="この行の書式">書式</button></div>
      <div class="row item" id="tgrow-1"><button class="mini" type="button" data-tgdel="1" title="この行を削除" aria-label="この行を削除">&minus;</button><input id="tg-1" type="text" value="" placeholder="写真に重なる一言（2行目）"><button class="mini gear" type="button" data-tgset="1" title="この行の書式" aria-label="この行の書式">書式</button></div>
      <div class="row item" id="tgrow-2"><button class="mini" type="button" data-tgdel="2" title="この行を削除" aria-label="この行を削除">&minus;</button><input id="tg-2" type="text" value="" placeholder="写真に重なる一言（3行目）"><button class="mini gear" type="button" data-tgset="2" title="この行の書式" aria-label="この��の書式">書式</button></div>
      <div class="row item" id="tgrow-3"><button class="mini" type="button" data-tgdel="3" title="この行を削除" aria-label="この行を削除">&minus;</button><input id="tg-3" type="text" value="" placeholder="写真に重なる一言（4行目）"><button class="mini gear" type="button" data-tgset="3" title="この行の書式" aria-label="この行の書式">書式</button></div>
      <div class="row item" id="tgrow-4"><button class="mini" type="button" data-tgdel="4" title="この行を削除" aria-label="この行を削除">&minus;</button><input id="tg-4" type="text" value="" placeholder="写真に重なる一言（5行目）"><button class="mini gear" type="button" data-tgset="4" title="この行の書式" aria-label="この行の書式">書式</button></div>
      </div>
      <button class="add" id="tgAdd" type="button">+ 行を追加</button>
    </div>

    <div class="group">
      <label class="title">リボンの文字（左）と料理名（右）</label>
      <div id="menuRows">
      <div class="row item" id="row-main"><button class="mini" type="button" data-del="main" title="この項目を削除" aria-label="この項目を削除">&minus;</button><input id="mainLabel" class="narrow" type="text" value="メイン"><input id="mainName" type="text" value="やさしい味のおかず"></div>
      <div class="row item" id="row-soup"><button class="mini" type="button" data-del="soup" title="この項目を削除" aria-label="この項目を削除">&minus;</button><input id="soupLabel" class="narrow" type="text" value="豚汁"><input id="soupName" type="text" value="豚汁"></div>
      <div class="row item" id="row-side"><button class="mini" type="button" data-del="side" title="この項目を削除" aria-label="この項目を削除">&minus;</button><input id="sideLabel" class="narrow" type="text" value="副菜"><input id="sideName" type="text" value="副菜"></div>
      <div class="row item" id="row-salad"><button class="mini" type="button" data-del="salad" title="この項目を削除" aria-label="この項目を削除">&minus;</button><input id="saladLabel" class="narrow" type="text" value="サラダ"><input id="saladName" type="text" value="サラダ"></div>
      <div class="row item" id="row-dessert"><button class="mini" type="button" data-del="dessert" title="この項目を削除" aria-label="この項目を削除">&minus;</button><input id="dessertLabel" class="narrow" type="text" value="デザート"><input id="dessertName" type="text" value="デザート"></div>
      </div>
      <button class="add" id="addItem" type="button">+ 項目を追加</button>
    </div>

    <div class="group">
      <label class="title">写真</label>
      <div id="photoControls"></div>
    </div>

    <button class="export" id="export">PNG画像を書き出す</button>
    <button class="secondary" id="reset">写真と文字の位置をリセット</button>
    <button class="link" id="clearSaved" type="button">保存された入力内容と画像を消す</button>
    <div class="footer">※写真はブラウザ内だけで処理します。</div>
  </section>
</div>


<div class="modal" id="tgModal" hidden>
  <div class="modal-back" id="tgSetBack"></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="tgSetTitle">
    <div class="modal-head">
      <strong id="tgSetTitle">1行目の書式</strong>
      <button class="modal-close" id="tgSetClose" type="button" aria-label="閉じる">&times;</button>
    </div>
    <div class="modal-body">
      <div class="set-row">
        <span class="key">文字サイズ</span>
        <input id="tgSize" type="range" min="14" max="64" step="1" value="22" aria-label="文字サイズ">
        <span class="val" id="tgSizeVal">22</span>
      </div>
      <div class="set-row">
        <span class="key">フォント</span>
        <select id="tgFont" aria-label="フォント"></select>
        <button class="mini gear" id="tgFontLoad" type="button" title="この端末に入っているフォントを一覧に追加">端末から読込</button>
      </div>
      <div class="set-row note" id="tgFontNote" hidden><span class="key"></span><span class="msg"></span></div>
      <div class="set-row">
        <span class="key">揃え</span>
        <div class="seg" id="tgAlign">
          <button type="button" data-align="left">左寄せ</button>
          <button type="button" data-align="center">中央</button>
          <button type="button" data-align="right">右寄せ</button>
        </div>
      </div>
      <div class="set-row">
        <span class="key">文字色</span>
        <input id="tgColor" type="color" value="#315b78" aria-label="文字色">
      </div>
      <div class="set-row">
        <span class="key">縁取り</span>
        <label class="chk"><input id="tgStrokeOn" type="checkbox"> つける</label>
        <input id="tgStrokeColor" type="color" value="#ffffff" aria-label="縁取りの色">
      </div>
      <div class="set-row">
        <span class="key">背景色</span>
        <label class="chk"><input id="tgBgOn" type="checkbox"> つける</label>
        <input id="tgBgColor" type="color" value="#f8f3e8" aria-label="背景の色">
      </div>
      <div class="set-note">設定はこの行だけに適用されます。「端末から読込」を押すと、このパソコンにインストール済みのフォントが選択肢に並びます（フォントファイルは同梱していません）。</div>
    </div>
  </div>
</div>

<div class="modal" id="adjModal" hidden>
  <div class="modal-back" id="adjBack"></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="adjTitle">
    <div class="modal-head">
      <strong id="adjTitle">位置と大きさの調整</strong>
      <button class="modal-close" id="adjClose" type="button" aria-label="閉じる">&times;</button>
    </div>
    <div class="modal-body">
      <canvas class="adj-cv" id="adjCanvas"></canvas>
      <div class="set-row">
        <span class="key">大きさ</span>
        <input id="adjZoom" type="range" min="50" max="400" step="1" value="100" aria-label="大きさ">
        <span class="val" id="adjZoomVal">100%</span>
      </div>
      <div class="adj-hint">指１本でなぞって位置を、指２本のピンチで大きさを調整できます。パソコンではドラッグとホイール、上のスライダーでも変えられます。</div>
      <div class="adj-actions">
        <button class="secondary" id="adjReset" type="button">この画像を初期位置に戻す</button>
        <button id="adjDone" type="button">これでOK</button>
      </div>
    </div>
  </div>
</div>

const WEEKDAYS=["日","月","火","水","木","金","土"];
// "2026-09-06" -> "9月6日（日）"空欄なら日付を描かない）
function dateLabel(){
  const v=val("dateText").trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return "";
  const [y,m,d]=v.split("-").map(Number);
  const dt=new Date(y,m-1,d);
  if(isNaN(dt))return "";
  return `${m}月${d}日（${WEEKDAYS[dt.getDay()]}）`;
}

let order=photoDefs.map(p=>p.id), pool=[];
function activeDefs(){
  return order.map(id=>photoDefs.find(p=>p.id===id)).filter(Boolean);
}
// evenly spaced and centered, whatever the count is
function menuLayout(){
  const defs=activeDefs(), n=defs.length, gap=203;
  const start=540-(n-1)*gap/2;
  return defs.map((p,i)=>({def:p,x:start+i*gap}));
}

function roundedRect(c,x,y,w,h,r){
  c.beginPath();c.roundRect(x,y,w,h,r);c.closePath();
}
function paper(){
  ctx.fillStyle="#f8f3e8";ctx.fillRect(0,0,W,H);
  // subtle paper flecks
  for(let i=0;i<650;i++){
    const x=Math.random()*W,y=Math.random()*H,a=.018+Math.random()*.025;
    ctx.fillStyle=`rgba(95,72,48,${a})`;ctx.fillRect(x,y,1,1);
  }
  // gingham border
  const s=18;
  for(let x=0;x<W;x+=s){
    ctx.fillStyle=(Math.floor(x/s)%2)?"rgba(91,139,169,.08)":"rgba(91,139,169,.16)";
    ctx.fillRect(x,0,s,28);ctx.fillRect(x,H-28,s,28);
  }
  for(let y=0;y<H;y+=s){
    ctx.fillStyle=(Math.floor(y/s)%2)?"rgba(91,139,169,.08)":"rgba(91,139,169,.16)";
    ctx.fillRect(0,y,28,s);ctx.fillRect(W-28,y,28,s);
  }
}
function flower(x,y,r=11){
  ctx.save();ctx.fillStyle="#5f86a1";
  for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(x+Math.cos(i*Math.PI*2/5)*r*.65,y+Math.sin(i*Math.PI*2/5)*r*.65,r*.45,r*.65,i*Math.PI*2/5,0,Math.PI*2);ctx.fill()}
  ctx.fillStyle="#f8f3e8";ctx.beginPath();ctx.arc(x,y,r*.23,0,Math.PI*2);ctx.fill();ctx.restore();
}
function drawLogo(cx,cy,size){
  const x=cx-size/2,y=cy-size/2;
  ctx.save();
  roundedRect(ctx,x,y,size,size,size*0.22);
  ctx.fillStyle="#1d5679";ctx.fill();
  ctx.clip();
  if(logoReady)ctx.drawImage(logoImg,x,y,size,size);
  ctx.restore();
  ctx.save();
  roundedRect(ctx,x,y,size,size,size*0.22);
  ctx.strokeStyle="rgba(49,91,120,.25)";ctx.lineWidth=2;ctx.stroke();
  ctx.restore();
}

const TG_MAX=5, TG_PAD=34;
const tgDefault=()=>({size:22,font:"mincho",align:"right",color:"#315b78",
  strokeOn:false,strokeColor:"#ffffff",bgOn:false,bgColor:"#f8f3e8"});
const tgConf=[];for(let i=0;i<TG_MAX;i++)tgConf.push(tgDefault());

// base spot + drag offset, always kept inside the photo frame
// rows in display order. blank rows at the end are dropped, blank rows in
// the middle keep their line space.
function tgLines(){
  const rows=tgOrder.map(i=>({i,t:val("tg-"+i)}));
  let last=-1;
  rows.forEach((r,k)=>{if(r.t.trim())last=k});
  return last<0?[]:rows.slice(0,last+1);
}
function tgMetrics(){
  const rows=tgLines();
  if(!rows.length)return null;
  const items=rows.map(r=>{
    const c=tgConf[r.i];
    ctx.save();ctx.font=`600 ${c.size}px ${fontCss(c.font)}`;
    const w=r.t.trim()?ctx.measureText(r.t).width:0;
    ctx.restore();
    return {text:r.t,conf:c,w,lh:Math.round(c.size*1.55)};
  });
  const maxW=items.reduce((m,it)=>Math.max(m,it.w),0);
  const below=items.reduce((s,it,k)=>k?s+it.lh:s,0);
  const st=state.tagline;
  const maxRight=PHOTO_R-TG_PAD;
  const minRight=Math.min(PHOTO_L+TG_PAD+maxW,maxRight);
  const right=Math.min(maxRight,Math.max(minRight,maxRight+st.x));
  st.x=right-maxRight;
  const first=items[0].conf.size;
  const minBase=PHOTO_T+TG_PAD+first;
  const maxBase=Math.max(minBase,PHOTO_B-TG_PAD-below);
  const baseline=Math.min(maxBase,Math.max(minBase,335+st.y));

function drawTagline(){
  const m=tgMetrics();
  if(!m)return;
  let y=m.baseline;
  m.items.forEach(it=>{
    const c=it.conf;
    if(it.text.trim()){
      const ax=c.align==="left"?m.left:(c.align==="center"?(m.left+m.right)/2:m.right);
      if(c.bgOn){
        const px=16, py=Math.round(c.size*0.42);
        const x0=c.align==="left"?ax-px:(c.align==="center"?ax-it.w/2-px:ax-it.w-px);
        ctx.save();ctx.fillStyle=c.bgColor;
        roundedRect(ctx,x0,y-c.size-py+4,it.w+px*2,c.size+py*2,12);ctx.fill();ctx.restore();

      const o={align:c.align,weight:600,color:c.color,font:fontCss(c.font)};

function hitTagline(x,y){

function isLight(hex){

function text(t,x,y,size,opts={}){

function splitTwo(t,maxWidth){
  const mid=Math.floor(t.length/2);
  const seps=[" ","\u3000","・","、","/","/"];
  let bestSep=null;
  for(let i=1;i<t.length-1;i++){
    if(seps.includes(t[i])){
      const d=Math.abs(i-mid);
      if(!bestSep||d<bestSep.d)bestSep={d,i};
    }
  }
  if(bestSep){
    const a=t.slice(0,bestSep.i).trim(),b=t.slice(bestSep.i).trim();
    if(a&&b)return [a,b];
  }
  let best=null;
  for(let i=1;i<t.length;i++){
    const a=t.slice(0,i),b=t.slice(i);
    const w=Math.max(ctx.measureText(a).width,ctx.measureText(b).width);

// fits a dish name into at most two lines
function wrapText(t,maxWidth,size,weight=600){
  const set=s=>ctx.font=`${weight} ${s}px "Noto Serif JP","Yu Mincho",serif`;
  let fs=size;set(fs);
  if(!t)return {fs,rows:[""]};
  if(ctx.measureText(t).width<=maxWidth)return {fs,rows:[t]};
  while(fs>17){fs--;set(fs);if(ctx.measureText(t).width<=maxWidth)return {fs,rows:[t]};}
  fs=size;set(fs);
  let rows=splitTwo(t,maxWidth);
  while(rows.some(r=>ctx.measureText(r).width>maxWidth)&&fs>13){
    fs--;set(fs);rows=splitTwo(t,maxWidth);

function clipImage(img,cx,cy,cw,ch,scale,ox,oy,r){

    roundedRect(ctx,cx-cw/2,cy-ch/2,cw,ch,32);ctx.clip();

function ribbon(x,y,w,h,label){

canvas.addEventListener("pointerdown",e=>{

  el.addEventListener("input",handler);el.addEventListener("change",handler);
}
bindTg("tgSize",(c,el)=>{c.size=Number(el.value);document.getElementById("tgSizeVal").textContent=el.value});
bindTg("tgFont",(c,el)=>{c.font=el.value});
bindTg("tgColor",(c,el)=>{c.color=el.value});
bindTg("tgStrokeOn",(c,el)=>{c.strokeOn=el.checked});
bindTg("tgStrokeColor",(c,el)=>{c.strokeColor=el.value});
bindTg("tgBgOn",(c,el)=>{c.bgOn=el.checked});
bindTg("tgBgColor",(c,el)=>{c.bgColor=el.value});
document.querySelectorAll("#tgAlign button").forEach(b=>{
  b.addEventListener("click",()=>{tgConf[tgEditing].align=b.dataset.align;paintTgAlign(b.dataset.align);draw()});
});
renderTgRows();
document.getElementById("reset").onclick=()=>{allStates().forEach(st=>{st.x=st.y=0;st.scale=1});draw()};
// file name stamp: the chosen date, or today when the date field is empty
function fileStamp(){
  const v=val("dateText");
  const d=v?new Date(v+"T00:00:00"):new Date();
  const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`;
}
document.getElementById("export").onclick=()=>{
  const a=document.createElement("a");a.download=`tsumugi_gohan_${fileStamp()}.png`;a.href=canvas.toDataURL("image/png");a.click();
};
(function(){
  const t=new Date();
  const p=n=>String(n).padStart(2,"0");
  document.getElementById("dateText").value=`${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())}`;
})();
rebuildControls();draw();
// help modal
const helpModal=document.getElementById("helpModal");
const setHelp=open=>{if(helpModal)helpModal.hidden=!open};
document.addEventListener("keydown",e=>{if(e.key==="Escape")setHelp(false)});

/* ---- pictures move only inside this dialog (easier on a phone) ---- */
const adjModal=document.getElementById("adjModal");
const adjCv=document.getElementById("adjCanvas"), adjCtx=adjCv.getContext("2d");
let adjT=null;
function drawAdjust(){
  if(!adjT)return;
  const f=adjT.f, cw=Math.round(adjT.cw*f), ch=Math.round(adjT.ch*f);
  if(adjCv.width!==cw||adjCv.height!==ch){adjCv.width=cw;adjCv.height=ch;}
  const st=adjT.st, img=adjT.img;
  adjCtx.clearRect(0,0,cw,ch);
  adjCtx.fillStyle="#dce8ed";adjCtx.fillRect(0,0,cw,ch);
  adjCtx.save();
  if(adjT.shape==="circle"){adjCtx.beginPath();adjCtx.arc(cw/2,ch/2,Math.min(cw,ch)/2,0,Math.PI*2);adjCtx.clip();}
  else{roundedRect(adjCtx,0,0,cw,ch,32*f);adjCtx.clip();}
  const iw=img.width, ih=img.height;
  const sc=Math.max(cw/iw,ch/ih)*st.scale;
  adjCtx.drawImage(img,cw/2-iw*sc/2+st.x*f,ch/2-ih*sc/2+st.y*f,iw*sc,ih*sc);
  adjCtx.restore();
  const pct=Math.round(st.scale*100);
  document.getElementById("adjZoom").value=pct;
  document.getElementById("adjZoomVal").textContent=pct+"%";
}
function openAdjust(t){
  adjT=t;
  document.getElementById("adjTitle").textContent=t.title;
  adjModal.hidden=false;
  drawAdjust();
}
function closeAdjust(){adjModal.hidden=true;adjT=null;adjPts.clear();adjG=null;draw();scheduleSave();}
document.getElementById("adjClose").addEventListener("click",closeAdjust);
document.getElementById("adjBack").addEventListener("click",closeAdjust);
document.getElementById("adjDone").addEventListener("click",closeAdjust);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!adjModal.hidden)closeAdjust()});
document.getElementById("adjReset").addEventListener("click",()=>{
  if(!adjT)return;
  adjT.st.x=0;adjT.st.y=0;adjT.st.scale=1;drawAdjust();draw();
});
document.getElementById("adjZoom").addEventListener("input",e=>{
  if(!adjT)return;
  adjT.st.scale=Math.max(.5,Math.min(4,Number(e.target.value)/100));drawAdjust();draw();
});
const adjPts=new Map();
let adjG=null;
const adjAvg=a=>({x:a.reduce((s,p)=>s+p.x,0)/a.length,y:a.reduce((s,p)=>s+p.y,0)/a.length});
const adjDist=a=>a.length<2?0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
function adjStart(){
  if(!adjT)return;
  const a=[...adjPts.values()], c=adjAvg(a);
  adjG={n:a.length,cx:c.x,cy:c.y,d:adjDist(a),x:adjT.st.x,y:adjT.st.y,scale:adjT.st.scale};
}
adjCv.addEventListener("pointerdown",e=>{
  if(!adjT)return;
  e.preventDefault();
  try{adjCv.setPointerCapture(e.pointerId)}catch(err){}
  adjPts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  adjStart();
});
adjCv.addEventListener("pointermove",e=>{
  if(!adjT||!adjG||!adjPts.has(e.pointerId))return;
  adjPts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const a=[...adjPts.values()];
  if(a.length!==adjG.n){adjStart();return}
  const rect=adjCv.getBoundingClientRect();
  const k=rect.width?adjT.cw/rect.width:1;
  const c=adjAvg(a);
  adjT.st.x=adjG.x+(c.x-adjG.cx)*k;
  adjT.st.y=adjG.y+(c.y-adjG.cy)*k;
  if(a.length>=2&&adjG.d>0)adjT.st.scale=Math.max(.5,Math.min(4,adjG.scale*adjDist(a)/adjG.d));
  drawAdjust();
});
function adjEnd(e){
  if(!adjPts.has(e.pointerId))return;
  adjPts.delete(e.pointerId);
  if(adjPts.size)adjStart();
  else{adjG=null;draw();scheduleSave();}
}
adjCv.addEventListener("pointerup",adjEnd);
adjCv.addEventListener("pointercancel",adjEnd);
adjCv.addEventListener("wheel",e=>{
  if(!adjT)return;
  e.preventDefault();
  adjT.st.scale=Math.max(.5,Math.min(4,adjT.st.scale*(e.deltaY<0?1.06:.94)));
  drawAdjust();draw();
},{passive:false});

/* ---- keeps the text and the chosen pictures even if the page reloads ---- */
const STORE_KEY="lunch";
let saveTimer=null, restoring=true;
function scheduleSave(){
  if(restoring)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveAll,700);
}
function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open("tsumugiStore",1);
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("kv"))r.result.createObjectStore("kv")};
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
async function idbPut(k,v){
  const db=await idbOpen();
  await new Promise((res,rej)=>{
    const tx=db.transaction("kv","readwrite");
    tx.objectStore("kv").put(v,k);
    tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);
  });
}
async function idbGet(k){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const tx=db.transaction("kv","readonly");
    const q=tx.objectStore("kv").get(k);
    q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);
  });
}
async function idbDel(k){
  const db=await idbOpen();
  await new Promise((res,rej)=>{
    const tx=db.transaction("kv","readwrite");
    tx.objectStore("kv").delete(k);
    tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);
  });
}
// a picture is kept as a shrunken JPEG so it survives a reload
function shrinkToData(img){
  try{
    const max=1800, s=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(img.width*s));
    c.height=Math.max(1,Math.round(img.height*s));
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",0.85);
  }catch(e){return null}
}
function snapshot(){
  const inputs={};
  document.querySelectorAll("section.controls input").forEach(el=>{
    if(!el.id||el.type==="file")return;
    inputs[el.id]=el.type==="checkbox"?el.checked:el.value;
  });
  const pics={};
  Object.keys(state).forEach(k=>{
    const st=state[k];
    pics[k]={x:st.x,y:st.y,scale:st.scale,data:st.data||null};
  });
  return {v:1,at:Date.now(),inputs,pics,
    order:order.slice(),pool:pool.slice(),
    tgOrder:tgOrder.slice(),tgPool:tgPool.slice(),
    tgConf:tgConf.map(c=>Object.assign({},c))};
}
async function saveAll(){try{await idbPut(STORE_KEY,snapshot())}catch(e){}}
function loadImgFrom(data){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>res(im);im.onerror=()=>res(null);
    im.src=data;
  });
}
async function restoreAll(){
  let rec=null;
  try{rec=await idbGet(STORE_KEY)}catch(e){}
  if(rec){
    if(rec.inputs)Object.entries(rec.inputs).forEach(([id,v])=>{
      const el=document.getElementById(id);
      if(!el)return;
      if(el.type==="checkbox")el.checked=!!v;else el.value=v;
    });
    if(Array.isArray(rec.order))order=rec.order.slice();
    if(Array.isArray(rec.pool))pool=rec.pool.slice();
    if(Array.isArray(rec.tgOrder))tgOrder=rec.tgOrder.slice();
    if(Array.isArray(rec.tgPool))tgPool=rec.tgPool.slice();
    if(Array.isArray(rec.tgConf))rec.tgConf.forEach((c,i)=>{if(c&&tgConf[i])tgConf[i]=Object.assign(tgDefault(),c)});
    if(rec.pics){
      for(const k of Object.keys(rec.pics)){
        const st=state[k], p=rec.pics[k];
        if(!st||!p)continue;
        st.x=p.x||0;st.y=p.y||0;st.scale=p.scale||1;
        if(p.data){
          const im=await loadImgFrom(p.data);
          if(im){st.img=im;st.data=p.data;st.thumb=p.data;}
        }
      }
    }
    renderRows();renderTgRows();rebuildControls();
  }
  restoring=false;
  draw();
}
restoreAll();
const ctlBox=document.querySelector("section.controls");
ctlBox.addEventListener("input",scheduleSave);
ctlBox.addEventListener("change",scheduleSave);
document.addEventListener("click",()=>scheduleSave());
document.getElementById("clearSaved").addEventListener("click",async()=>{
  if(!confirm("\u4fdd\u5b58\u3055\u308c\u3066\u3044\u308b\u5165\u529b\u5185\u5bb9\u3068\u753b\u50cf\u3092\u6d88\u3057\u3066\u3001\u6700\u521d\u306e\u72b6\u614b\u306b\u623b\u3057\u307e\u3059\u3002\u3088\u308d\u3057\u3044\u3067\u3059\u304b\uff1f"))return;
  restoring=true;
  try{await idbDel(STORE_KEY)}catch(e){}
  location.reload();
});
</script>
