<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>つむぎごはん｜ランチメーカー</title>
<style>
  :root{
    --ink:#315b78;
    --blue:#5f86a1;
    --pale:#e9f0f3;
    --paper:#f8f3e8;
    --line:#9bb2c0;
    --red:#bd6b62;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:#dce5e8;
    color:#294b62;
    font-family:"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  }
  .app{
    max-width:1100px;
    margin:auto;
    padding:18px;
    display:grid;
    grid-template-columns:minmax(300px,1fr) 360px;
    gap:18px;
  }
  h1{font-size:20px;margin:0 0 4px;letter-spacing:.08em}
  .sub{font-size:12px;color:#688396;margin-bottom:14px}
  .panel{
    background:rgba(255,255,255,.78);
    border:1px solid rgba(49,91,120,.12);
    border-radius:18px;
    padding:16px;
    box-shadow:0 8px 30px rgba(40,70,85,.08);
  }
  .preview-wrap{
    display:flex;justify-content:center;align-items:flex-start;
  }
  canvas{
    width:min(100%,720px);
    height:auto;
    display:block;
    border-radius:8px;
    box-shadow:0 10px 30px rgba(35,58,70,.18);
    touch-action:none;
    background:var(--paper);
  }
  .controls{display:flex;flex-direction:column;gap:12px}
  .group{
    border-top:1px solid #d5e0e5;
    padding-top:12px;
  }
  .group:first-child{border-top:0;padding-top:0}
  label.title{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
  .row{display:flex;gap:8px}
  input[type=text]{
    width:100%;padding:10px 11px;border:1px solid #c7d5dc;border-radius:10px;
    background:#fff;font:inherit;font-size:13px;
  }
  .photo-row{
    display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;
    margin:7px 0;
  }
  .thumb{
    width:64px;height:50px;object-fit:cover;border-radius:8px;background:#e7eef1;
    border:1px solid #c9d8df;
  }
  .photo-name{font-size:12px;font-weight:700}
  .photo-note{font-size:10px;color:#79909e;margin-top:2px}
  button{
    border:0;border-radius:10px;padding:10px 12px;background:#5f86a1;color:white;
    font:700 12px inherit;cursor:pointer;
  }
  button.secondary{background:#e8eff2;color:#315b78}
  button.export{background:#315b78;font-size:14px;padding:13px}
  button:active{transform:translateY(1px)}
  .hint{
    font-size:10px;color:#718995;line-height:1.6;background:#f0f5f6;border-radius:10px;padding:9px;
  }
  .footer{font-size:10px;color:#7b909a;text-align:center;padding:3px}
  @media(max-width:850px){
    .app{grid-template-columns:1fr;padding:10px}
    .panel{padding:10px}
    .controls{order:2}
  }
</style>
</head>
<body>
<div class="app">
  <section class="panel">
    <h1>つむぎごはん｜ランチメーカー</h1>
    <div class="sub">写真と料理名を入れ替えるだけ。Instagram用 1080 × 1080 px。</div>
    <div class="preview-wrap"><canvas id="canvas" width="1080" height="1080"></canvas></div>
  </section>

  <section class="panel controls">
    <div class="group">
      <label class="title">タイトル</label>
      <div class="row">
        <input id="headline" type="text" value="本日のランチ">
        <input id="tagline" type="text" value="あの頃と変わらない、やさしい味を。">
      </div>
    </div>

    <div class="group">
      <label class="title">料理名</label>
      <div class="row"><input id="mainName" type="text" value="やさしい味のおかず"></div>
      <div class="row"><input id="sideName" type="text" value="副菜"></div>
      <div class="row"><input id="soupName" type="text" value="豚汁"></div>
      <div class="row"><input id="saladName" type="text" value="サラダ"></div>
      <div class="row"><input id="dessertName" type="text" value="デザート"></div>
    </div>

    <div class="group">
      <label class="title">写真</label>
      <div id="photoControls"></div>
    </div>

    <div class="group">
      <div class="hint">
        写真は自動でトリミングされます。プレビュー上の写真をドラッグすると位置調整、ホイール/ピンチで拡大縮小できます。
        写真を使わない場合は、イラスト風の仮画像が表示されます。
      </div>
    </div>

    <button class="export" id="export">PNG画像を書き出す</button>
    <button class="secondary" id="reset">写真の位置・拡大率をリセット</button>
    <div class="footer">※写真はブラウザ内だけで処理します。</div>
  </section>
</div>

<script>
const W=1080,H=1080;
const canvas=document.getElementById("canvas"), ctx=canvas.getContext("2d");
const photoDefs=[
  {id:"main",label:"メイン",input:"mainName",shape:"main"},
  {id:"side",label:"副菜",input:"sideName",shape:"circle"},
  {id:"soup",label:"豚汁",input:"soupName",shape:"circle"},
  {id:"salad",label:"サラダ",input:"saladName",shape:"circle"},
  {id:"dessert",label:"デザート",input:"dessertName",shape:"circle"}
];
const photos={};
const state={};
photoDefs.forEach((p,i)=>state[p.id]={x:0,y:0,scale:1,img:null,drag:false,sx:0,sy:0,ox:0,oy:0});

function roundedRect(c,x,y,w,h,r){
  c.beginPath();c.roundRect(x,y,w,h,r);c.closePath();
}
function paper(){
  ctx.fillStyle="#f8f3e8";ctx.fillRect(0,0,W,H);
  // subtle paper flecks
  for(let i=0;i<650;i++){
    const x=Math.random()*W,y=Math.random()*H,a=.018+Math.random()*.025;
    ctx.fillStyle=`rgba(95,72,48,${a})`;ctx.fillRect(x,y,1,1);
  }
  // gingham border
  const s=18;
  for(let x=0;x<W;x+=s){
    ctx.fillStyle=(Math.floor(x/s)%2)?"rgba(91,139,169,.08)":"rgba(91,139,169,.16)";
    ctx.fillRect(x,0,s,28);ctx.fillRect(x,H-28,s,28);
  }
  for(let y=0;y<H;y+=s){
    ctx.fillStyle=(Math.floor(y/s)%2)?"rgba(91,139,169,.08)":"rgba(91,139,169,.16)";
    ctx.fillRect(0,y,28,s);ctx.fillRect(W-28,y,28,s);
  }
}
function flower(x,y,r=11){
  ctx.save();ctx.fillStyle="#5f86a1";
  for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(x+Math.cos(i*Math.PI*2/5)*r*.65,y+Math.sin(i*Math.PI*2/5)*r*.65,r*.45,r*.65,i*Math.PI*2/5,0,Math.PI*2);ctx.fill()}
  ctx.fillStyle="#f8f3e8";ctx.beginPath();ctx.arc(x,y,r*.23,0,Math.PI*2);ctx.fill();ctx.restore();
}
function drawGrandma(x,y){
  ctx.save();ctx.strokeStyle="#315b78";ctx.fillStyle="#315b78";ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(x,y,28,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(x,y-4,24,Math.PI,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(x-9,y+2,3,0,Math.PI*2);ctx.arc(x+9,y+2,3,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x,y+8,8,0,Math.PI);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-20,y+30);ctx.quadraticCurveTo(x,y+12,x+20,y+30);ctx.stroke();
  ctx.restore();
}
function text(t,x,y,size,opts={}){
  ctx.save();
  ctx.font=`${opts.weight||400} ${size}px ${opts.font||'"Noto Serif JP","Yu Mincho",serif'}`;
  ctx.fillStyle=opts.color||"#315b78";ctx.textAlign=opts.align||"left";ctx.textBaseline=opts.base||"alphabetic";
  if(opts.rotate)ctx.rotate(opts.rotate);
  ctx.fillText(t,x,y);
  ctx.restore();
}
function fitText(t,maxWidth,size,weight=700){
  let s=size;ctx.font=`${weight} ${s}px "Noto Serif JP","Yu Mincho",serif`;
  while(ctx.measureText(t).width>maxWidth && s>18){s-- ;ctx.font=`${weight} ${s}px "Noto Serif JP","Yu Mincho",serif`}
  return s;
}
function clipImage(img,cx,cy,cw,ch,scale,ox,oy,r){
  ctx.save();
  if(r==="circle"){
    ctx.beginPath();ctx.arc(cx,cy,cw/2,0,Math.PI*2);ctx.clip();
  }else{
    roundedRect(ctx,cx-cw/2,cy-ch/2,cw,ch,32);ctx.clip();
  }
  const iw=img.width,ih=img.height;
  const base=Math.max(cw/iw,ch/ih);
  const sc=base*scale;
  const dw=iw*sc,dh=ih*sc;
  ctx.drawImage(img,cx-dw/2+ox,cy-dh/2+oy,dw,dh);
  ctx.restore();
}
function placeholder(cx,cy,cw,ch,label,r){
  ctx.save();
  if(r==="circle"){ctx.beginPath();ctx.arc(cx,cy,cw/2,0,Math.PI*2);ctx.fillStyle="#dce8ed";ctx.fill();ctx.strokeStyle="#a7bfcc";ctx.stroke();}
  else{roundedRect(ctx,cx-cw/2,cy-ch/2,cw,ch,32);ctx.fillStyle="#dce8ed";ctx.fill();ctx.strokeStyle="#a7bfcc";ctx.stroke();}
  text(label,cx,cy+7,28,{align:"center",weight:700,color:"#6d8b9b"});
  ctx.restore();
}
function ribbon(x,y,w,h,label){
  ctx.save();ctx.fillStyle="#4f7897";
  ctx.beginPath();ctx.moveTo(x-w/2,y-h/2);ctx.lineTo(x+w/2,y-h/2);ctx.lineTo(x+w/2-18,y);ctx.lineTo(x+w/2,y+h/2);ctx.lineTo(x-w/2,y+h/2);ctx.lineTo(x-w/2+18,y);ctx.closePath();ctx.fill();
  text(label,x,y+9,24,{align:"center",weight:700,color:"#fff"});
  ctx.restore();
}
function draw(){
  paper();
  // Header
  flower(78,73,9); flower(1002,88,9);
  text(document.getElementById("headline").value,70,125,fitText(document.getElementById("headline").value,640,68),{weight:700});
  text("LUNCH MENU",76,158,22,{weight:500,font:'"Arial",sans-serif'});
  // grandmother + concept
  drawGrandma(815,116);
  text("おばあちゃんから",650,62,22,{align:"center",weight:600});
  text("受け継がれてきたごはん",650,90,22,{align:"center",weight:600});
  // photo area
  const main=state.main;
  if(main.img)clipImage(main.img,540,440,920,500,main.scale,main.x,main.y,"main");
  else placeholder(540,440,920,500,"メイン写真", "main");
  // torn-ish white edge
  ctx.fillStyle="#f8f3e8";ctx.beginPath();ctx.moveTo(28,705);ctx.quadraticCurveTo(270,690,540,710);ctx.quadraticCurveTo(810,730,1052,704);ctx.lineTo(1052,760);ctx.lineTo(28,760);ctx.closePath();ctx.fill();
  // handwritten message
  text(document.getElementById("tagline").value,1010,335,22,{align:"right",weight:600});
  text("今日も。",1005,368,28,{align:"right",weight:700});
  // menu strip
  text("MENU",540,788,25,{align:"center",weight:600,font:'"Arial",sans-serif'});
  ctx.strokeStyle="#9bb2c0";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(280,780);ctx.lineTo(470,780);ctx.moveTo(610,780);ctx.lineTo(800,780);ctx.stroke();
  const xs=[135,338,540,742,945], cy=865, d=135;
  photoDefs.forEach((p,i)=>{
    const st=state[p.id], x=xs[i];
    if(st.img)clipImage(st.img,x,cy,d,d,st.scale,st.x,st.y,"circle");
    else placeholder(x,cy,d,d,p.label,"circle");
    ribbon(x,962,145,38,p.label);
    const name=document.getElementById(p.input).value;
    const fs=fitText(name,160,19,600);
    text(name,x,1019,fs,{align:"center",weight:600});
  });
  text("※ 副菜・デザートは内容が変更になる場合があります",540,1055,13,{align:"center",color:"#668293"});
  // little bow
  ctx.strokeStyle="#4f7897";ctx.lineWidth=3;ctx.beginPath();
  ctx.moveTo(500,1039);ctx.quadraticCurveTo(470,1018,486,1009);ctx.quadraticCurveTo(505,1005,540,1032);
  ctx.quadraticCurveTo(575,1005,594,1009);ctx.quadraticCurveTo(610,1018,580,1039);ctx.stroke();
}
function rebuildControls(){
  const box=document.getElementById("photoControls");box.innerHTML="";
  photoDefs.forEach(p=>{
    const row=document.createElement("div");row.className="photo-row";
    row.innerHTML=`<img class="thumb" id="thumb-${p.id}" alt=""><div><div class="photo-name">${p.label}</div><div class="photo-note">クリックして写真を選択</div></div><button class="secondary">選択</button>`;
    const input=document.createElement("input");input.type="file";input.accept="image/*";input.hidden=true;
    row.querySelector("button").onclick=()=>input.click();
    input.onchange=()=>{if(input.files[0])loadPhoto(p.id,input.files[0]);};
    row.appendChild(input);box.appendChild(row);
  });
}
function loadPhoto(id,file){
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{state[id].img=img;state[id].x=state[id].y=0;state[id].scale=1;
    document.getElementById("thumb-"+id).src=url;draw();};
  img.src=url;
}
function pointerPos(e){
  const r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};
}
function hitPhoto(p,x,y){
  if(p.shape==="main")return x>80&&x<1000&&y>190&&y<690;
  const xs=[135,338,540,742,945];const dx=x-xs[photoDefs.indexOf(p)],dy=y-865;
  return dx*dx+dy*dy<(67.5*67.5);
}
canvas.addEventListener("pointerdown",e=>{
  const q=pointerPos(e);
  for(const p of photoDefs){
    if(hitPhoto(p,q.x,q.y)){
      const st=state[p.id];st.drag=true;st.sx=q.x;st.sy=q.y;st.ox=st.x;st.oy=st.y;
      canvas.setPointerCapture(e.pointerId);break;
    }
  }
});
canvas.addEventListener("pointermove",e=>{
  const q=pointerPos(e);
  for(const p of photoDefs){const st=state[p.id];if(st.drag){st.x=st.ox+(q.x-st.sx);st.y=st.oy+(q.y-st.sy);draw();}}
});
canvas.addEventListener("pointerup",()=>photoDefs.forEach(p=>state[p.id].drag=false));
canvas.addEventListener("wheel",e=>{
  e.preventDefault();const q=pointerPos(e);
  for(const p of photoDefs)if(hitPhoto(p,q.x,q.y)){
    state[p.id].scale=Math.max(.5,Math.min(3,state[p.id].scale*(e.deltaY<0?1.06:.94)));draw();break;
  }
},{passive:false});
["headline","tagline","mainName","sideName","soupName","saladName","dessertName"].forEach(id=>document.getElementById(id).addEventListener("input",draw));
document.getElementById("reset").onclick=()=>{photoDefs.forEach(p=>{state[p.id].x=state[p.id].y=0;state[p.id].scale=1});draw()};
document.getElementById("export").onclick=()=>{
  const a=document.createElement("a");a.download="tsumugi-gohan-lunch.png";a.href=canvas.toDataURL("image/png");a.click();
};
rebuildControls();draw();
</script>
</body>
</html>
